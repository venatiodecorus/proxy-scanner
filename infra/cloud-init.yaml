#cloud-config

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg

write_files:
  - path: /opt/proxy-scanner/docker-compose.yml
    owner: root:root
    permissions: "0644"
    content: |
      ${compose_file}

  - path: /etc/cron.d/proxy-scanner
    owner: root:root
    permissions: "0644"
    content: |
      # Proxy scanner schedule
      #
      # A full IPv4 sweep is ~56h of masscan time (3.37B addresses in scope
      # after exclusions x 3 ports / 50k pps). SCAN_TIMEOUT=4h caps each
      # session and saves /data/paused.conf, so each run advances the sweep by
      # 4h and the next run resumes from there. Daily 4h sessions therefore
      # complete a full sweep roughly every 14 days.
      #
      # flock -n is mandatory, not decorative: masscan keeps its resume state in
      # a single paused.conf, so two concurrent sessions would corrupt it and
      # double the effective packet rate. -n skips the firing outright if the
      # previous one is still running rather than queueing behind it.
      SHELL=/bin/bash
      # Scanner: daily at 02:00 UTC (runs until ~06:00 UTC)
      0 2 * * * root /usr/bin/flock -n /var/lock/proxy-scanner-scan.lock -c 'cd /opt/proxy-scanner && /usr/bin/docker compose --profile scan run --rm scanner' >> /var/log/proxy-scanner-scan.log 2>&1
      # Validator: daily at 07:00 UTC, an hour after the scan window closes, so
      # it drains the candidates queue on the same cadence the scanner fills it.
      0 7 * * * root /usr/bin/flock -n /var/lock/proxy-scanner-validate.lock -c 'cd /opt/proxy-scanner && /usr/bin/docker compose --profile scan run --rm validator' >> /var/log/proxy-scanner-validate.log 2>&1

  - path: /etc/logrotate.d/proxy-scanner
    owner: root:root
    permissions: "0644"
    content: |
      /var/log/proxy-scanner-*.log {
        daily
        rotate 14
        compress
        missingok
        notifempty
      }

runcmd:
  # Install Docker Engine (official method)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Add ubuntu user to docker group
  - usermod -aG docker ubuntu

  # Enable and start Docker
  - systemctl enable docker
  - systemctl start docker

  # Pull all images (--profile scan includes scanner + validator)
  - cd /opt/proxy-scanner && docker compose --profile scan pull
  # Start the API (only service without a profile, so it starts by default)
  - cd /opt/proxy-scanner && docker compose up -d

  # Signal that cloud-init is done
  - echo "cloud-init complete: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /opt/proxy-scanner/.cloud-init-done
