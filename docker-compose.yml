# Host-specific values are read from a .env file sitting next to this compose
# file (Compose picks it up automatically). See deploy/env.example. The defaults
# below are the safe choices for an unconfigured host, not the production ones.
services:
  api:
    image: ghcr.io/venatiodecorus/proxy-scanner-api:latest
    container_name: proxy-scanner-api
    restart: unless-stopped
    ports:
      # Defaults to loopback so a fresh box never publishes the API to the
      # internet by accident. Set API_BIND_ADDR to the host's Tailscale address
      # to reach it from the tailnet.
      - "${API_BIND_ADDR:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - scanner-data:/data
    environment:
      DB_PATH: /data/proxies.db
      LISTEN_ADDR: ":8080"
      # Set API_TOKEN in .env to require a Bearer token on every route except
      # /v1/health. Empty means auth is disabled.
      API_TOKEN: "${API_TOKEN:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  scanner:
    image: ghcr.io/venatiodecorus/proxy-scanner-scanner:latest
    container_name: proxy-scanner-scanner
    profiles: ["scan"]
    network_mode: host
    cap_add:
      - NET_RAW
    volumes:
      - scanner-data:/data
    environment:
      # Keep in step with the 50k pps ceiling documented in AGENTS.md and the
      # README. Higher rates are the main driver of abuse complaints and of
      # packet loss on Hetzner Cloud's shared NICs.
      SCAN_RATE: "${SCAN_RATE:-50000}"
      SCAN_PORTS: "${SCAN_PORTS:-1080,1081,9050}"
      # Leave empty to let masscan pick the default-route interface. Set it in
      # .env only if that guess is wrong (the old hardcoded "ens3" was an
      # OpenStack-ism and does not exist on Debian, where it is usually eth0
      # or enp1s0).
      SCAN_ADAPTER: "${SCAN_ADAPTER:-}"
      DB_PATH: /data/proxies.db
      OUTPUT_FILE: /data/candidates.json
      RESUME_FILE: /data/paused.conf
      SCAN_TIMEOUT: "4h"

  validator:
    image: ghcr.io/venatiodecorus/proxy-scanner-validator:latest
    container_name: proxy-scanner-validator
    profiles: ["scan"]
    volumes:
      - scanner-data:/data
    environment:
      DB_PATH: /data/proxies.db
      GEOIP_CITY_DB: /geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /geoip/GeoLite2-ASN.mmdb
      WORKERS: "500"
      TIMEOUT: "10"
      TEST_URL: "http://httpbin.org/ip"
      # EFnet RBL checks of endpoint and observed exit IP are mandatory.
      # SKIP_AUX_BLOCKLISTS: "true"  # disable only optional auxiliary DNSBLs
      # BATCH_SIZE: "1000"            # candidates to dequeue per batch

  # Long-running service that periodically rechecks validated proxies and
  # evicts ones that have been failing for too long. Runs alongside the API
  # by default (no profile required).
  revalidator:
    image: ghcr.io/venatiodecorus/proxy-scanner-revalidator:latest
    container_name: proxy-scanner-revalidator
    restart: unless-stopped
    volumes:
      - scanner-data:/data
    environment:
      DB_PATH: /data/proxies.db
      GEOIP_CITY_DB: /geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /geoip/GeoLite2-ASN.mmdb
      WORKERS: "100"
      TIMEOUT: "10"
      TEST_URL: "http://httpbin.org/ip"
      BATCH_SIZE: "500"
      RECHECK_INTERVAL: "1h"      # don't recheck a proxy more often than this
      IDLE_SLEEP: "60s"           # sleep when nothing is due
      FAILURE_THRESHOLD: "3"      # consecutive fails before marking 'stale'
      EVICT_AFTER: "168h"         # delete stale proxies after 7 days w/o success
      EVICT_INTERVAL: "1h"        # how often to run the eviction sweep
      # EFnet RBL checks of endpoint and observed exit IP are mandatory.
      # SKIP_AUX_BLOCKLISTS: "true"  # disable only optional auxiliary DNSBLs

volumes:
  scanner-data: