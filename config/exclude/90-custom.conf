# ============================================================================
# Custom Exclusions
#
# Add networks here that have requested not to be scanned, or that have
# triggered abuse complaints. One CIDR per line. Comments start with #.
#
# Format:
#   <CIDR>    # <reason> (<date added>)
#
# Examples:
#   203.0.113.0/24    # Abuse complaint from ISP X (2025-01-15)
#   198.51.100.0/24   # Requested opt-out via email (2025-02-20)
#
# After editing this file:
#   1. Commit and push to main
#   2. GitHub Actions rebuilds and pushes the scanner image to GHCR
#   3. On the scanner host, pull it:  sudo /opt/proxy-scanner/update.sh
#
# Step 3 is manual and easy to forget. The exclusion list is baked into the
# scanner image at build time, so until the host pulls the new image the old
# list is still in force and the range keeps being scanned. Verify with:
#   docker run --rm --entrypoint grep \
#     ghcr.io/venatiodecorus/proxy-scanner-scanner:latest \
#     -c . /config/exclude.conf
#
# The new exclusions take effect on the next scan session after the pull.
# ============================================================================
